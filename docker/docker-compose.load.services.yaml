# The six services under load: the load database, the stub instead
# of the paid APIs, throttling and tracing off. Merged after
# docker-compose.services.yaml and docker-compose.load.yaml.

x-load-env: &load-env
  DATABASE_URL: postgresql://app:dev@postgres:5432/${LOAD_DB:-contracts_load}
  S3_BUCKET: contracts-load
  EMBEDDING_PROVIDER: voyage
  VOYAGE_API_KEY: stub
  VOYAGE_BASE_URL: http://stub-apis:8080/v1
  RERANK_PROVIDER: ${LOAD_RERANK:-none}
  COHERE_API_KEY: stub
  COHERE_BASE_URL: http://stub-apis:8080/v2
  LLM_PROVIDER: anthropic
  LLM_MODEL: claude-haiku-4-5
  ANTHROPIC_API_KEY: stub
  ANTHROPIC_BASE_URL: http://stub-apis:8080
  LEXICAL_MATCH: ${LEXICAL_MATCH:-all}
  QUERY_MIN_SIMILARITY: '0'
  THROTTLE_ENABLED: 'false'
  OTEL_EXPORTER_OTLP_ENDPOINT: ''
  # A run, its warm-up and the seeding share one login.
  JWT_EXPIRES_IN: 4h

x-after-stub: &after-stub
  stub-apis: { condition: service_healthy }

services:
  api-gateway: { environment: *load-env, depends_on: *after-stub }
  auth-service: { environment: *load-env, depends_on: *after-stub }
  ingestion-service: { environment: *load-env, depends_on: *after-stub }
  indexing-service: { environment: *load-env, depends_on: *after-stub }
  retrieval-service: { environment: *load-env, depends_on: *after-stub }
  llm-service: { environment: *load-env, depends_on: *after-stub }
