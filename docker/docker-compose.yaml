# Every port is published on 127.0.0.1 only. The credentials below are
# development ones (`dev`, `minioadmin`), and a port published on all
# interfaces is reachable from the whole network the laptop is on.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: contracts
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d contracts']
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ['127.0.0.1:5672:5672', '127.0.0.1:15672:15672']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']

  minio:
    # MinIO no longer publishes images (the Docker Hub repository is gone and
    # quay.io wants a login), so this is Chainguard's build of the same server
    # from source — RELEASE.2026-09-22T19-25-18Z. Only `latest` is free, and
    # `latest` is whatever was built on the day of the pull, which is no basis
    # for repeatable measurements: hence the digest.
    #
    # It runs as uid 65532, not root. A fresh volume works as is (the image's
    # /data is world-writable); a volume the old root image wrote needs a
    # one-time `chown -R 65532:65532 /data`.
    image: cgr.dev/chainguard/minio@sha256:4cf4831a2bbcf13ddca09c1cbcc9faff716dd3c4247e0babc32864b8ee8e0034
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [miniodata:/data]
    # `mc` ships inside this image too; `--wait` in CI relies on this check.
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
