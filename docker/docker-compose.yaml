# Every port is published on 127.0.0.1 only. The credentials below are
# development ones (`dev`, `minioadmin`), and a port published on all
# interfaces is reachable from the whole network the laptop is on.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: contracts
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d contracts']
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ['127.0.0.1:5672:5672', '127.0.0.1:15672:15672']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']

  minio:
    # MinIO publishes no major-version tag, only `latest` and dated releases —
    # and `latest` is whatever Docker Hub had on the day of the pull, which is
    # no basis for repeatable measurements.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [miniodata:/data]
    # `mc` ships inside the image; `--wait` in CI relies on this check.
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
