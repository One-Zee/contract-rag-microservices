# One job per process, named after the service, so the `job` label is the
# service name in every query. Only one of the two topologies runs at a time:
# with the six services up, `monolith` is down, and the other way round — a
# down target is expected, not a fault.
#
# Five seconds, not the default fifteen: a k6 run lasts minutes, and a
# percentile over three samples per minute says little.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api-gateway
    static_configs: [{ targets: ['api-gateway:9464'] }]
  - job_name: auth-service
    static_configs: [{ targets: ['auth-service:9464'] }]
  - job_name: ingestion-service
    static_configs: [{ targets: ['ingestion-service:9464'] }]
  - job_name: indexing-service
    static_configs: [{ targets: ['indexing-service:9464'] }]
  - job_name: retrieval-service
    static_configs: [{ targets: ['retrieval-service:9464'] }]
  - job_name: llm-service
    static_configs: [{ targets: ['llm-service:9464'] }]
  - job_name: monolith
    static_configs: [{ targets: ['monolith:9464'] }]

  # Broker-wide totals.
  - job_name: rabbitmq
    static_configs: [{ targets: ['rabbitmq:15692'] }]

  # The same exporter per queue — the plain endpoint sums every queue, and
  # `indexing` is the one that fills up when indexing-service cannot keep up
  # (§9.4), apart from the dead-letter queue beside it.
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params: { family: [queue_coarse_metrics] }
    static_configs: [{ targets: ['rabbitmq:15692'] }]

  # CPU and memory per container (the `cadvisor` profile, on a Linux host).
  - job_name: cadvisor
    static_configs: [{ targets: ['cadvisor:8080'] }]
