# The Express twin of the auth flow (bench/express-auth), for the
# framework-overhead comparison. Merged over docker-compose.yaml and
# docker-compose.load.yaml; it shares the load database and the JWT keys
# from .env, so its tokens and the Nest services' tokens are interchangeable.

services:
  express-auth:
    image: clauseiq:local
    pull_policy: never
    init: true
    command: ['node', 'dist/bench/express-auth/main.js']
    env_file:
      - path: ../.env
        required: false
      - path: stack.env
    environment:
      DATABASE_URL: postgresql://app:dev@postgres:5432/${LOAD_DB:-contracts_load}
      PORT: '3100'
      OTEL_EXPORTER_OTLP_ENDPOINT: ''
      JWT_EXPIRES_IN: 4h
    # One process, like the monolith in the overhead runs: OVERHEAD_CPUS for
    # both (eval/load/run-load.ts sets MONOLITH_CPUS to the same value).
    deploy:
      resources:
        limits:
          cpus: '${OVERHEAD_CPUS:-1}'
          memory: ${OVERHEAD_MEMORY:-512M}
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3100/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
