name: CI
on: [push, pull_request]

# Node 24: the lockfile is written by npm 12, and the npm 10 that Node 22 ships
# refuses it in `npm ci`; Node 24 ships npm 11. The image is built on the same
# major (docker/Dockerfile).

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run dep:check
      - run: npm test

  db:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://app:dev@localhost:5432/contracts
      PGPASSWORD: dev
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci

      # The same compose file `npm run dev` uses, so CI runs against the
      # infrastructure the code was written against — not a look-alike from a
      # `services:` block. `--wait` returns once every healthcheck passes.
      - name: Start Postgres, RabbitMQ and MinIO
        run: docker compose -f docker/docker-compose.yaml up -d --wait postgres rabbitmq minio

      - run: npm run db:migrate

      # Migration 0000 must stay first in the sequence — without the extension
      # the `vector` type does not exist and everything after it fails.
      - name: pgvector extension exists
        run: |
          psql "$DATABASE_URL" -tAc \
            "SELECT 1 FROM pg_extension WHERE extname = 'vector'" | grep -q 1

      # The real purpose of this job: `drizzle-kit push` (and the odd hand-written
      # migration) can regenerate the HNSW index without its operator class, so
      # search silently degrades to a sequential scan instead of failing loudly.
      - name: HNSW index survived the migrations
        run: |
          psql "$DATABASE_URL" -tAc \
            "SELECT indexdef FROM pg_indexes
             WHERE tablename = 'chunks' AND indexdef LIKE '%hnsw%'" \
            | grep -q vector_cosine_ops

      - name: GIN index over the generated tsv column exists
        run: |
          psql "$DATABASE_URL" -tAc \
            "SELECT indexdef FROM pg_indexes
             WHERE tablename = 'chunks' AND indexname = 'chunks_tsv_gin'" \
            | grep -q gin

      # The lexical branch queries with plainto_tsquery('english', …). If the
      # column were generated with another configuration the query would match
      # nothing at all — no error, just an empty half of every search.
      - name: the tsv column is generated with the same configuration the search uses
        run: |
          psql "$DATABASE_URL" -tAc \
            "SELECT pg_get_expr(d.adbin, d.adrelid)
             FROM pg_attrdef d
             JOIN pg_attribute a ON a.attrelid = d.adrelid AND a.attnum = d.adnum
             WHERE d.adrelid = 'chunks'::regclass AND a.attname = 'tsv'" \
            | grep -q "'english'"

      # A missing table here is a migration that did not reach CI, which would
      # only show up as a failing answer pipeline much later.
      - name: the query log tables exist
        run: |
          psql "$DATABASE_URL" -tAc \
            "SELECT to_regclass('queries'), to_regclass('answers'),
                    to_regclass('answer_citations')" \
            | grep -q 'queries|answers|answer_citations'

      # One answer per query: a retry policy that re-answered would double the
      # denominator of every per-answer metric
      - name: an answer belongs to exactly one query
        run: |
          psql "$DATABASE_URL" -tAc \
            "SELECT indexdef FROM pg_indexes
             WHERE tablename = 'answers' AND indexdef LIKE '%query_id%'" \
            | grep -q 'CREATE UNIQUE INDEX'

      # The pipeline replaces a document's chunks in one transaction and counts
      # on this index to make a double run impossible, not merely unlikely.
      - name: chunk positions are unique per document
        run: |
          psql "$DATABASE_URL" -tAc \
            "SELECT indexdef FROM pg_indexes
             WHERE tablename = 'chunks' AND indexname = 'chunks_doc_idx'" \
            | grep -q 'CREATE UNIQUE INDEX'

      # Each suite boots the services it needs over real TCP — api-gateway,
      # auth-service, ingestion-service, retrieval-service and llm-service —
      # plus indexing-service as a RabbitMQ consumer, against this job's
      # Postgres, RabbitMQ and MinIO. The RS256 key pair is generated by the
      # tests themselves, embeddings come from the `fake` provider, no reranker
      # runs and the model is the `fake` one, so no secrets are needed here.
      # Scoped to test/e2e: nothing under apps/*/test is a real suite.
      - name: e2e — auth, documents, indexing, search and query
        run: npm run test:e2e -- test/e2e

      - name: Stop the infrastructure
        if: always()
        run: docker compose -f docker/docker-compose.yaml down -v

  # The one image every service and the monolith run from (ADR 020), built so a
  # Dockerfile that no longer builds is caught here and not on the day of a
  # measurement. Pull requests only, and nothing is pushed: a registry and a
  # deploy job wait for the VPS.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No .env in CI: the files declare it optional, and interpolation falls
      # back to its defaults — enough to prove each topology merges cleanly.
      - name: compose files are valid
        run: |
          docker compose -f docker/docker-compose.yaml \
            -f docker/docker-compose.observability.yaml \
            -f docker/docker-compose.services.yaml config -q
          docker compose -f docker/docker-compose.yaml \
            -f docker/docker-compose.observability.yaml \
            -f docker/docker-compose.monolith.yaml config -q

      - name: the image builds
        run: docker build -f docker/Dockerfile -t clauseiq:ci .
