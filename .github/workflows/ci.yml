name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run dep:check
      - run: npm test

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: contracts
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d contracts"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:dev@localhost:5432/contracts
      PGPASSWORD: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:migrate

      # Migration 0000 must stay first in the sequence — without the extension
      # the `vector` type does not exist and everything after it fails.
      - name: pgvector extension exists
        run: |
          psql "$DATABASE_URL" -tAc \
            "SELECT 1 FROM pg_extension WHERE extname = 'vector'" | grep -q 1

      # The real purpose of this job: `drizzle-kit push` (and the odd hand-written
      # migration) can regenerate the HNSW index without its operator class, so
      # search silently degrades to a sequential scan instead of failing loudly.
      - name: HNSW index survived the migrations
        run: |
          psql "$DATABASE_URL" -tAc \
            "SELECT indexdef FROM pg_indexes
             WHERE tablename = 'chunks' AND indexdef LIKE '%hnsw%'" \
            | grep -q vector_cosine_ops

      - name: GIN index over the generated tsv column exists
        run: |
          psql "$DATABASE_URL" -tAc \
            "SELECT indexdef FROM pg_indexes
             WHERE tablename = 'chunks' AND indexname = 'chunks_tsv_gin'" \
            | grep -q gin

      # Boots api-gateway and auth-service in one process over real TCP against
      # this job's Postgres. The RS256 key pair is generated by the test itself,
      # so no secrets are needed here. Scoped to test/e2e: the phase 2-5
      # boilerplate specs under apps/*/test would fail env validation without
      # RABBITMQ_URL / S3_* — each phase adds its own step when it has real tests.
      - name: e2e — auth over TCP
        run: npm run test:e2e -- test/e2e
